<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1d2a2a;--mute:#6b7a78;--pri:#17695a;--acc:#e8a33d;--line:#e3dfd3;--ok:#2e8b57;--bad:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#121a19;--card:#1b2625;--ink:#eaf1ef;--mute:#93a5a2;--pri:#3fb59d;--line:#2a3837}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:560px;margin:auto;padding:14px 14px 90px}
h1,h2{margin:.2em 0}h2{font-size:1.2rem}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}.bar h2{flex:1}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--pri);color:#fff}
button.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc)}
input,textarea{width:100%;font:inherit;padding:11px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);color:var(--ink);border:1px solid var(--line);text-align:left;padding:16px 12px;font-weight:600}
.tile span{display:block;font-size:1.7rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.mute{color:var(--mute);font-size:.9rem}
.pill{padding:2px 8px;border-radius:99px;background:var(--acc);color:#222;font-size:.75rem}
.w{cursor:pointer;border-radius:4px}.w:hover{background:var(--acc)}
#txt{font-size:1.08rem;line-height:1.8}
.opt{display:block;width:100%;text-align:left;margin:5px 0;background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.opt.ok{border-color:var(--ok);background:rgba(46,139,87,.15)}.opt.bad{border-color:var(--bad);background:rgba(192,57,43,.15)}
#pop{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);width:min(92%,420px);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 8px 30px #0003;z-index:5}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--acc);color:#222;font-size:1.6rem;z-index:6;box-shadow:0 6px 18px #0004}
#ov{position:fixed;inset:0;z-index:10;background:rgba(15,25,24,.45);backdrop-filter:blur(10px);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px 12px}
#msgs{flex:1;overflow:auto;padding:10px 0}.m{max-width:85%;margin:6px 0;padding:10px 12px;border-radius:14px;white-space:pre-wrap}
.m.u{margin-left:auto;background:var(--pri);color:#fff}.m.a{background:var(--card)}
.lv{display:flex;gap:8px;flex-wrap:wrap}.lv button{flex:1;min-width:70px}
.hide{display:none!important}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.stat b{display:block;font-size:1.3rem}.stat small{color:var(--mute)}
svg.i{vertical-align:-.2em;flex:none}.tile svg{color:var(--pri);margin-bottom:6px}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--pri);color:#fff;padding:8px 16px;border-radius:99px;z-index:20}
</style></head><body>
<div id="app"></div>
<button id="fab" class="hide" aria-label="AI"></button>
<div id="ov" class="hide"><div class="bar"><h2 style="color:#fff;flex:1">AI Assistant</h2><button id="cl" class="ghost" style="color:#fff;border-color:#fff" aria-label="close"></button></div>
<div id="msgs"></div><div class="row"><input id="ci" placeholder="..." style="flex:1"><button id="cs" aria-label="send"></button></div></div>
<script src="words.js"></script>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const $=s=>document.querySelector(s),app=$('#app');
const IC={
book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
mic:'<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4"/>',
head:'<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>',
file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>',
pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
type:'<path d="M4 7V4h16v3M9 20h6M12 4v16"/>',
cards:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/>',
star:'<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.9-6.2-3.3-6.2 3.3L7 14.2 2 9.3l6.9-1z"/>',
trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/>',
chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
vol:'<path d="M11 5L6 9H2v6h4l5 4z"/><path d="M19 5a10 10 0 0 1 0 14M15.5 8.5a5 5 0 0 1 0 7"/>',
plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="M20 6L9 17l-5-5"/>',x:'<path d="M18 6L6 18M6 6l12 12"/>',
trash:'<path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4h6v2"/>',
globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10z"/>',
gear:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
back:'<path d="M19 12H5M12 19l-7-7 7-7"/>',play:'<path d="M6 4l14 8-14 8z"/>',stop:'<path d="M6 6h12v12H6z"/>',
clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
refresh:'<path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/>',
send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',
bot:'<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 14h.01M15 14h.01M9.5 17h5"/>',
flame:'<path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/>',
bolt:'<path d="M13 2L3 14h9l-1 8 10-12h-9z"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
logo:'<path d="M22 10L12 5 2 10l10 5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>'};
const I=(n,z=18)=>`<svg class="i" width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const H=()=>({'Content-Type':'application/json','x-init-data':tg?.initData||''});
function toast(x){const d=document.createElement('div');d.id='toast';d.textContent=x;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
const LN={uz:'Uzbek',ru:'Russian',en:'English'};
const T={
 uz:{hi:'Xush kelibsiz!',name:'Ismingiz',age:'Yoshingiz',lang:'Interfeys tili',go:'Boshlash',vocab:'Lug‘at',speaking:'Speaking',listening:'Listening',reading:'Reading',writing:'Writing',grammar:'Grammatika',mine:'Mening so‘zlarim',back:'Orqaga',search:'So‘z qidirish...',level:'Darajani tanlang',load:'Yuklanmoqda...',tr:'Tarjima',err:'Xatolik, qayta urining',check:'Tekshirish',quest:'Savollar',top:'Eng muhim 20 so‘z',empty:'Hozircha bo‘sh',topic:'Mavzu',yours:'Javobingiz...',more:'Yangi ma’lumot',track:'Audio',play:'Tinglash',score:'Natija',lg:'Til',daily:'Kun so‘zi',streak:'Ketma-ket kun',review:'Takrorlash',know:'Bilaman',again:'Yana',top:'Reyting',stats:'Statistika',gen:'AI bilan 20 ta so‘z qo‘shish'},
 ru:{hi:'Добро пожаловать!',name:'Ваше имя',age:'Возраст',lang:'Язык интерфейса',go:'Начать',vocab:'Словарь',speaking:'Speaking',listening:'Listening',reading:'Reading',writing:'Writing',grammar:'Грамматика',mine:'Мои слова',back:'Назад',search:'Поиск слова...',level:'Выберите уровень',load:'Загрузка...',tr:'Перевод',err:'Ошибка, повторите',check:'Проверить',quest:'Вопросы',top:'20 важных слов',empty:'Пока пусто',topic:'Тема',yours:'Ваш ответ...',more:'Новая информация',track:'Аудио',play:'Слушать',score:'Результат',lg:'Язык',daily:'Слово дня',streak:'Дней подряд',review:'Повторение',know:'Знаю',again:'Ещё раз',top:'Рейтинг',stats:'Статистика',gen:'Добавить 20 слов с ИИ'},
 en:{hi:'Welcome!',name:'Your name',age:'Your age',lang:'Interface language',go:'Start',vocab:'Vocabulary',speaking:'Speaking',listening:'Listening',reading:'Reading',writing:'Writing',grammar:'Grammar',mine:'My words',back:'Back',search:'Search a word...',level:'Choose a level',load:'Loading...',tr:'Translate',err:'Error, try again',check:'Check',quest:'Questions',top:'20 key words',empty:'Nothing yet',topic:'Topic',yours:'Your answer...',more:'More info',track:'Audio',play:'Play',score:'Score',lg:'Language',daily:'Word of the day',streak:'Day streak',review:'Review',know:'I know it',again:'Again',top:'Leaderboard',stats:'Statistics',gen:'Add 20 words with AI'}};
let S=JSON.parse(localStorage.getItem('S')||'null')||{lang:'uz',name:'',age:'',mine:[],xp:0,streak:0,best:0,log:[]};
let st;
const save=()=>{localStorage.setItem('S',JSON.stringify(S));clearTimeout(st);st=setTimeout(()=>fetch('/api/me',{method:'POST',headers:H(),body:JSON.stringify({name:S.name,age:S.age,lang:S.lang,mine:S.mine})}).catch(()=>{}),800)};
const t=k=>T[S.lang][k];
async function sync(){try{const r=await fetch('/api/me',{headers:H()});const d=await r.json();if(d.user){if(d.user.age)Object.assign(S,d.user);else if(S.name)save()}}catch(e){}}
async function logProg(kind,level,score,total){try{const r=await fetch('/api/progress',{method:'POST',headers:H(),body:JSON.stringify({kind,level,score,total})});const d=await r.json();if(d.user){Object.assign(S,{xp:d.user.xp,streak:d.user.streak,best:d.user.best,log:d.user.log});localStorage.setItem('S',JSON.stringify(S));toast('+'+d.gain+' XP')}}catch(e){}}
const BASE=WORDS.slice();
async function loadWords(){try{const r=await fetch('/api/words',{headers:H()});const c=await r.json();const have=new Set(BASE.map(w=>w[0]));window.WORDS=BASE.concat((c.words||[]).filter(w=>!have.has(w[0])))}catch(e){}}
async function genWords(){const b=$('#gw');b.disabled=true;b.textContent=t('load');try{const r=await fetch('/api/words/generate',{method:'POST',headers:H(),body:JSON.stringify({have:WORDS.map(w=>w[0]).slice(-400)})});await r.json();await loadWords();vocab()}catch(e){b.textContent=t('err')}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function ai(system,user,json){
 const r=await fetch('/api/ai',{method:'POST',headers:H(),body:JSON.stringify({json,messages:[{role:'system',content:system},...(Array.isArray(user)?user:[{role:'user',content:user}])]})});
 const d=await r.json();if(!d.text)throw Error(d.error);return json?JSON.parse(d.text):d.text}
const SYS=()=>`You are a friendly English teacher for a ${S.age||'adult'}-year-old learner named ${S.name}. Explain in ${LN[S.lang]}; the language being taught is English, so give examples in English (with ${LN[S.lang]} translation when helpful).`;
const say=(w,rate=.9)=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=rate;speechSynthesis.speak(u)};
const LV=['A1','A2','B1','B2','C1'];
const lvBtns=fn=>`<p>${t('level')}</p><div class="lv">${LV.map(l=>`<button onclick="${fn}('${l}')">${l}</button>`).join('')}</div>`;
const head=(title,back='home')=>`<div class="bar"><button class="ghost" onclick="${back.includes('=>')?`(${back})()`:back+'()'}">${I('back')} ${t('back')}</button><h2>${title}</h2></div>`;
const addWord=(w,tr)=>{if(!S.mine.some(x=>x.w==w)){S.mine.push({w,tr});save()}};
const loading=()=>app.innerHTML+=`<p class="mute" id="ld">${t('load')}</p>`;

// ---------- onboarding ----------
function onboard(){
 app.innerHTML=`<h1>${I('logo',30)} English</h1><p>${t('hi')}</p>
 <p class="mute">${t('lang')}</p><div class="lv">${['uz','ru','en'].map(l=>`<button class="${S.lang==l?'':'ghost'}" onclick="S.lang='${l}';save();onboard()">${{uz:'O‘zbek',ru:'Русский',en:'English'}[l]}</button>`).join('')}</div>
 <p><input id="n" placeholder="${t('name')}" value="${esc(S.name)}"></p><p><input id="a" type="number" min="4" max="99" placeholder="${t('age')}" value="${S.age}"></p>
 <button onclick="S.name=$('#n').value.trim();S.age=$('#a').value;if(S.name&&S.age){save();home()}">${t('go')}</button>`;
 $('#fab').classList.add('hide')}
// ---------- home ----------
function home(){
 const tiles=[['book','vocab','vocab'],['mic','speaking','speaking'],['head','listening','listening'],['file','reading','reading'],['pen','writing','writing'],['type','grammar','grammar'],['cards','review','review'],['star','mine','mine'],['trophy','top','leaders'],['chart','stats','stats']];
 const w=WORDS[Math.floor(Date.now()/864e5)%WORDS.length];
 app.innerHTML=`<div class="bar"><h2>${esc(S.name)}</h2><button class="ghost" onclick="onboard()" aria-label="settings">${I('gear')}</button></div>
 <div class="stat"><div>${I('flame',22)}<b>${S.streak||0}</b><small>${t('streak')}</small></div><div>${I('bolt',22)}<b>${S.xp||0}</b><small>XP</small></div><div>${I('star',22)}<b>${S.mine.length}</b><small>${t('mine')}</small></div></div>
 <div class="card"><div class="mute row">${I('sun')} ${t('daily')}</div><div class="row"><b style="font-size:1.2rem">${w[0]}</b><span class="pill">${w[1]}</span><span style="flex:1"></span><button class="ghost" onclick="say('${w[0]}')">${I('vol')}</button></div><div>${S.lang=='ru'?w[3]:w[2]}</div><div class="mute">“${w[4]}”</div></div>
 <div class="grid">${tiles.map(([i,k,f])=>`<button class="tile" onclick="${f}()"><span>${I(i,28)}</span>${t(k)}</button>`).join('')}</div>`;
 $('#fab').classList.remove('hide')}
// ---------- vocabulary ----------
function vocab(){
 app.innerHTML=head(`${t('vocab')} (${WORDS.length})`)+`<input id="q" placeholder="${t('search')}" oninput="vlist()"><div id="vl"></div><button id="gw" class="ghost" style="width:100%;margin-top:10px" onclick="genWords()">${I('plus')} ${t('gen')}</button>`;vlist()}
function vlist(){
 const q=$('#q').value.trim().toLowerCase();
 const L=WORDS.filter(w=>w[0].startsWith(q)).sort((a,b)=>a[0].localeCompare(b[0]));
 $('#vl').innerHTML=L.map((w,i)=>`<div class="card"><div class="row"><b>${w[0]}</b><span class="pill">${w[1]}</span><span style="flex:1"></span><button class="ghost" onclick="say('${w[0]}')">${I("vol")}</button><button class="ghost" onclick="addWord('${w[0]}','${w[S.lang=='ru'?3:2]}');this.textContent='✓'">${I("plus")}</button></div>
 <div>${S.lang=='ru'?w[3]:w[2]}</div><div class="mute">“${w[4]}” <a href="#" onclick="say('${w[4].replace(/'/g,"\\'")}');return false">${I("vol")}</a></div></div>`).join('')||`<p class="mute">${t('empty')}</p>`}
// ---------- my words ----------
function mine(){
 app.innerHTML=head(t('mine'))+(S.mine.map((x,i)=>`<div class="card row"><b>${x.w}</b><span style="flex:1">${esc(x.tr)}</span><button class="ghost" onclick="say('${x.w}')">${I("vol")}</button><button class="ghost" onclick="S.mine.splice(${i},1);save();mine()">${I("trash")}</button></div>`).join('')||`<p class="mute">${t('empty')}</p>`)}
// ---------- reading ----------
function reading(){app.innerHTML=head(t('reading'))+lvBtns('readLv')}
async function readLv(l){
 app.innerHTML=head(t('reading'),'reading');loading();
 try{const d=await ai(SYS(),`Write an original English reading text for CEFR level ${l} (about ${{A1:80,A2:120,B1:180,B2:250,C1:320}[l]} words) on a random interesting topic. Then 10 multiple-choice comprehension questions in English. Return JSON: {"title":"","text":"","questions":[{"q":"","options":["","","",""],"answer":0}]}`,true);
 window.R=d;R.kind='reading';R.level=l;renderRead()}catch(e){app.innerHTML+=t('err')}}
function renderRead(){
 const d=R,html=d.text.replace(/[A-Za-z'’-]+/g,w=>`<span class="w" onclick="wordTap(this)">${w}</span>`);
 app.innerHTML=head(d.title,'reading')+`<div class="card" id="txt">${html}</div><h2>${t('quest')}</h2>`+d.questions.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q.q)}</b>${q.options.map((o,j)=>`<button class="opt" data-q="${i}" onclick="pick(this,${i},${j})">${esc(o)}</button>`).join('')}</div>`).join('')+`<div id="res"></div>`;window.ans={}}
function pick(b,i,j){if(ans[i]!==undefined)return;ans[i]=j;const ok=R.questions[i].answer==j;b.classList.add(ok?'ok':'bad');
 if(!ok)b.parentNode.querySelectorAll('.opt')[R.questions[i].answer]?.classList.add('ok');
 if(Object.keys(ans).length==R.questions.length)(R.kind=='listening'?finLis:finishRead)()}
async function finishRead(){
 const sc=R.questions.filter((q,i)=>q.answer==ans[i]).length;logProg('reading',R.level,sc,10);
 $('#res').innerHTML=`<div class="card"><b>${t('score')}: ${sc}/${R.questions.length}</b></div><p class="mute">${t('load')}</p>`;
 try{const d=await ai(SYS(),`From this text pick the 20 most useful and difficult words. Translate each into ${LN[S.lang]}. JSON: {"words":[{"w":"","tr":""}]}. Text: ${R.text}`,true);
 $('#res').innerHTML=`<h2>${t('top')}</h2>`+d.words.map(x=>`<div class="card row"><b>${esc(x.w)}</b><span style="flex:1">${esc(x.tr)}</span><button class="ghost" onclick="say('${esc(x.w)}')">${I("vol")}</button><button class="ghost" onclick="addWord('${esc(x.w)}','${esc(x.tr)}');this.textContent='✓'">${I("plus")}</button></div>`).join('')}catch(e){$('#res').innerHTML=t('err')}}
const trc={};
function wordTap(el){
 const w=el.textContent.toLowerCase().replace(/^['’-]+|['’-]+$/g,'');
 $('#pop')?.remove();const p=document.createElement('div');p.id='pop';
 p.innerHTML=`<div class="row"><b>${w}</b><span style="flex:1"></span><button class="ghost" onclick="say('${w}')">${I("vol")}</button><button id="tb">${I("globe")}</button><button class="ghost" onclick="$('#pop').remove()">${I("x")}</button></div><div id="pt"></div>`;
 document.body.appendChild(p);
 $('#tb').onclick=async()=>{$('#pt').textContent='...';
  try{const k=S.lang+w;if(!trc[k])trc[k]=(await ai(`Translate the English word into ${LN[S.lang]} in its meaning here. Context: "${(R?.text||'').slice(0,0)}". Reply with only 1-3 translation words.`,w)).trim();
  $('#pt').innerHTML=`<p>${esc(trc[k])}</p><button onclick="addWord('${w}','${esc(trc[k]).replace(/'/g,'')}');this.textContent='✓'">${I("plus")} ${t('mine')}</button>`}catch(e){$('#pt').textContent=t('err')}}}
// ---------- listening ----------
const TOPICS=['Daily routine','At the airport','Ordering food','Weather','Shopping','Family','Hobbies','Health','Travel plans','School life'];
function listening(){app.innerHTML=head(t('listening'))+lvBtns('lisLv')}
function lisLv(l){app.innerHTML=head(t('listening'),'listening')+`<h2>${l}</h2>`+TOPICS.map((x,i)=>`<button class="tile card" style="width:100%" onclick="lisGo('${l}',${i})">${I("head")} ${t('track')} ${i+1}: ${x}</button>`).join('')}
async function lisGo(l,i){
 app.innerHTML=head(`${l} · ${TOPICS[i]}`,`()=>lisLv('${l}')`);loading();
 try{const d=await ai(SYS(),`Write an English listening script (CEFR ${l}, topic "${TOPICS[i]}", ~${{A1:70,A2:100,B1:150,B2:200,C1:260}[l]} words, a monologue or dialogue). Then 10 multiple-choice questions about it. JSON: {"script":"","questions":[{"q":"","options":["","","",""],"answer":0}]}`,true);
 window.R=d;window.ans={};
 app.innerHTML=head(`${l} · ${TOPICS[i]}`,`()=>lisLv('${l}')`)+`<div class="card row"><button onclick="say(R.script,1)">${I('play')} ${t('play')}</button><button class="ghost" onclick="say(R.script,.7)">${I("clock")}</button><button class="ghost" onclick="speechSynthesis.cancel()">${I("stop")}</button></div><h2>${t('quest')}</h2>`+d.questions.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q.q)}</b>${q.options.map((o,j)=>`<button class="opt" onclick="pick(this,${i},${j})">${esc(o)}</button>`).join('')}</div>`).join('')+`<div id="res"></div>`;
 R.kind='listening';R.level=l;window.finLis=()=>{const sc=R.questions.filter((q,i)=>q.answer==ans[i]).length;logProg('listening',l,sc,10);$('#res').innerHTML=`<div class="card"><b>${t('score')}: ${sc}/10</b></div><details class="card"><summary>Script</summary>${esc(R.script)}</details>`}}catch(e){app.innerHTML+=t('err')}}
// ---------- speaking / writing ----------
function practice(kind){
 const sp=kind=='speaking';
 app.innerHTML=head(t(kind))+`<div class="card" id="tp"></div><textarea id="pa" rows="5" placeholder="${t('yours')}"></textarea><div class="row" style="margin-top:8px">${sp&&(window.SpeechRecognition||window.webkitSpeechRecognition)?`<button class="ghost" onclick="mic()">${I("mic")}</button>`:''}<button onclick="grade('${kind}')">${t('check')}</button><button class="ghost" onclick="newTopic('${kind}')">${I("refresh")} ${t('topic')}</button></div><div class="card hide" id="fb"></div>`;newTopic(kind)}
const speaking=()=>practice('speaking'),writing=()=>practice('writing');
async function newTopic(k){$('#tp').textContent='...';try{window.TP=await ai(SYS(),k=='speaking'?'Give one short English speaking prompt/question for conversation practice. Only the prompt.':'Give one short English writing task (3-5 sentences). Only the task.');$('#tp').innerHTML=esc(TP)+` <a href="#" onclick="say(TP);return false">${I("vol")}</a>`}catch(e){$('#tp').textContent=t('err')}}
function mic(){const R=new(window.SpeechRecognition||window.webkitSpeechRecognition)();R.lang='en-US';R.onresult=e=>$('#pa').value=e.results[0][0].transcript;R.start()}
async function grade(k){const v=$('#pa').value.trim();if(!v)return;const f=$('#fb');f.classList.remove('hide');f.textContent='...';
 try{f.innerHTML=esc(await ai(SYS(),`Task: ${TP}\nStudent ${k=='speaking'?'said':'wrote'}: ${v}\nCorrect mistakes, show the corrected version, explain briefly, give a score /10 and one tip.`));logProg(k,'',1,1)}catch(e){f.textContent=t('err')}}
// ---------- grammar ----------
const GR=['Present Simple','Present Continuous','Past Simple','Present Perfect','Future (will / going to)','Articles a/an/the','Modal verbs','Conditionals','Comparatives & Superlatives','Prepositions','Passive voice','Reported speech'];
function grammar(){app.innerHTML=head(t('grammar'))+GR.map((g,i)=>`<button class="tile card" style="width:100%" onclick="gram(${i})">${g}</button>`).join('')}
async function gram(i,more){
 const key='g'+S.lang+i;if(!more&&localStorage[key]){return showGram(i,localStorage[key])}
 app.innerHTML=head(GR[i],'grammar');loading();
 try{const x=await ai(SYS(),`Explain "${GR[i]}" clearly: rule, formation, 5 example sentences with translation, 3 common mistakes, and a 3-question mini exercise with answers.${more?' Give NEW information and different examples than a standard lesson.':''}`);localStorage[key]=x;showGram(i,x)}catch(e){app.innerHTML+=t('err')}}
const showGram=(i,x)=>app.innerHTML=head(GR[i],'grammar')+`<div class="card" style="white-space:pre-wrap">${esc(x)}</div><button onclick="gram(${i},1)">${t('more')}</button>`;
// ---------- review / leaderboard / stats ----------
let RV=[];
function review(){RV=S.mine.slice().sort(()=>Math.random()-.5);rv()}
function rv(){const x=RV[0];
 if(!x){app.innerHTML=head(t('review'))+`<p class="mute">${t('empty')}</p>`;return}
 const tr=esc(x.tr).replace(/'/g,'');
 app.innerHTML=head(t('review'))+`<div class="card" style="text-align:center;padding:30px"><div style="font-size:1.8rem;font-weight:700">${esc(x.w)}</div><p><button class="ghost" onclick="say('${esc(x.w)}')">${I('vol')}</button></p><div id="ans" style="min-height:2em;font-size:1.1rem"></div><button id="sh" onclick="$('#ans').textContent='${tr}';$('#sh').classList.add('hide');$('#kn').classList.remove('hide')">${t('tr')}</button><div id="kn" class="row hide" style="justify-content:center"><button onclick="rvNext(1)">${I('check')} ${t('know')}</button><button class="ghost" onclick="rvNext(0)">${I('refresh')} ${t('again')}</button></div></div><p class="mute">${RV.length}</p>`}
function rvNext(k){const x=RV.shift();if(k)logProg('review','',1,1);else RV.push(x);rv()}
async function leaders(){app.innerHTML=head(t('top'))+`<p class="mute">${t('load')}</p>`;
 try{const r=await fetch('/api/top',{headers:H()});const d=await r.json();app.innerHTML=head(t('top'))+d.top.map((u,i)=>`<div class="card row"><b>${i+1}</b><span style="flex:1">${esc(u.name)}</span><span>${I('flame')} ${u.streak}</span><b>${u.xp} XP</b></div>`).join('')}catch(e){app.innerHTML+=t('err')}}
function stats(){
 const days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5).toISOString().slice(0,10);return{d:d.slice(5),xp:(S.log||[]).filter(l=>l.d==d).reduce((a,l)=>a+l.xp,0)}});
 const m=Math.max(10,...days.map(x=>x.xp));
 app.innerHTML=head(t('stats'))+`<div class="card"><svg viewBox="0 0 280 130" width="100%" role="img">${days.map((x,i)=>`<rect x="${i*40+6}" y="${100-x.xp/m*90}" width="28" height="${x.xp/m*90}" rx="5" fill="var(--pri)"/><text x="${i*40+20}" y="118" font-size="10" text-anchor="middle" fill="var(--mute)">${x.d}</text>`).join('')}</svg></div>`+(S.log||[]).slice(-10).reverse().map(l=>`<div class="card row"><b>${l.kind}</b><span class="pill">${l.level||'-'}</span><span style="flex:1" class="mute">${l.d}</span><span>${l.score}/${l.total}</span><b>+${l.xp}</b></div>`).join('')}
// ---------- AI chat ----------
let hist=[];
$('#fab').onclick=()=>{$('#ov').classList.remove('hide');if(!hist.length)addM('a',`Hi ${S.name}!`)};
$('#cl').onclick=()=>$('#ov').classList.add('hide');
function addM(r,x){const d=document.createElement('div');d.className='m '+r;d.textContent=x;$('#msgs').appendChild(d);$('#msgs').scrollTop=1e9;return d}
async function send(){const v=$('#ci').value.trim();if(!v)return;$('#ci').value='';addM('u',v);hist.push({role:'user',content:v});const b=addM('a','...');
 try{const a=await ai(SYS()+' You can talk about any topic; gently steer toward learning English.',hist.slice(-12));hist.push({role:'assistant',content:a});b.textContent=a}catch(e){b.textContent=t('err')}}
$('#cs').onclick=send;$('#ci').onkeydown=e=>e.key=='Enter'&&send();
$('#fab').innerHTML=I('bot',28);$('#cl').innerHTML=I('x');$('#cs').innerHTML=I('send');
(async()=>{await Promise.all([sync(),loadWords()]);S.name&&S.age?home():onboard()})();
</script></body></html>
